<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwYfZzmqfrWrKBzVqD4K7wMEfuLoWGRXsgB2zGBp7fjB0JpCHKn9-vWoKHQb05KAaWN/exec";


/* ================================
   NAVIGASI
================================ */

function showPage(page) {

  const inputPage =
    document.getElementById("inputPage");

  const dashboardPage =
    document.getElementById("dashboardPage");

  if (page === "input") {

    inputPage.classList.remove("hidden");
    dashboardPage.classList.add("hidden");

  } else {

    inputPage.classList.add("hidden");
    dashboardPage.classList.remove("hidden");

  }

}


/* ================================
   SIMPAN PROGRES
================================ */

function submitTraining() {

  const status =
    document.getElementById("statusInput");

  const nama =
    document.getElementById("nama").value.trim();

  const kelas =
    document.getElementById("kelas").value;

  const materi =
    document.getElementById("materi").value;

  const pertemuan =
    document.getElementById("pertemuan").value;

  const tanggal =
    document.getElementById("tanggal").value;


  if (
    !nama ||
    !kelas ||
    !materi ||
    !pertemuan ||
    !tanggal
  ) {

    status.className =
      "status error";

    status.style.display =
      "block";

    status.innerHTML =
      "❌ Lengkapi data wajib terlebih dahulu.";

    return;
  }


  status.className =
    "status";

  status.style.display =
    "block";

  status.innerHTML =
    "⏳ Mengirim data...";


  /* ================================
     BUAT FORM TERSEMBUNYI
  ================================= */

  const form =
    document.createElement("form");

  form.method = "POST";
  form.action = API_URL;
  form.target = "moveGrowFrame";
  form.style.display = "none";


  const data = {

    nama: nama,

    kelas: kelas,

    materi: materi,

    pertemuan: pertemuan,

    tanggal: tanggal,

    indikator:
      document.getElementById("indikator").value,

    hasil:
      document.getElementById("hasil").value,

    satuan:
      document.getElementById("satuan").value,

    catatan:
      document.getElementById("catatan").value,

    berhasil:
      document.getElementById("berhasil").value,

    kesulitan:
      document.getElementById("kesulitan").value,

    pelajaran:
      document.getElementById("pelajaran")
        ? document.getElementById("pelajaran").value
        : "",

    target:
      document.getElementById("target").value,

    growth:
      document.getElementById("growth").value

  };


  Object.keys(data).forEach(function(key) {

    const input =
      document.createElement("input");

    input.type = "hidden";
    input.name = key;
    input.value = data[key];

    form.appendChild(input);

  });


  document.body.appendChild(form);


  /* ================================
     KIRIM KE APPS SCRIPT
  ================================= */

  form.submit();


  /* ================================
     TAMPILKAN HASIL
  ================================= */

  setTimeout(function() {

    status.className =
      "status success";

    status.style.display =
      "block";

    status.innerHTML =
      "✅ Data berhasil dikirim. Cek Google Sheets.";


    document
      .getElementById("trainingForm")
      .reset();


    form.remove();

  }, 2500);

}


/* ================================
   IFRAME TERSEMBUNYI
================================ */

const frame =
  document.createElement("iframe");

frame.name =
  "moveGrowFrame";

frame.id =
  "moveGrowFrame";

frame.style.display =
  "none";

document.body.appendChild(frame);


/* ================================
   TAMPILKAN PROGRES
================================ */

function loadProgress() {

  const nama =
    document
      .getElementById("cariNama")
      .value
      .trim();

  const status =
    document.getElementById(
      "statusDashboard"
    );


  if (!nama) {

    status.className =
      "status error";

    status.style.display =
      "block";

    status.innerHTML =
      "❌ Masukkan nama terlebih dahulu.";

    return;
  }


  status.className =
    "status";

  status.style.display =
    "block";

  status.innerHTML =
    "⏳ Mengambil progres...";


  /*
   * Gunakan iframe GET.
   * Tidak menggunakan fetch sehingga
   * tidak terkena masalah CORS.
   */

  const frameName =
    "progressFrame_" +
    Date.now();

  const iframe =
    document.createElement("iframe");

  iframe.name =
    frameName;

  iframe.style.display =
    "none";

  document.body.appendChild(iframe);


  const form =
    document.createElement("form");

  form.method =
    "GET";

  form.action =
    API_URL;

  form.target =
    frameName;

  form.style.display =
    "none";


  const input =
    document.createElement("input");

  input.name =
    "nama";

  input.value =
    nama;

  form.appendChild(input);

  document.body.appendChild(form);


  /*
   * Untuk sementara,
   * dashboard GET tetap diarahkan
   * melalui endpoint Apps Script.
   */

  form.submit();


  setTimeout(function() {

    status.innerHTML =
      "ℹ️ Data sedang dimuat. Jika belum muncul, kita akan sambungkan dashboard setelah penyimpanan berhasil.";

    form.remove();
    iframe.remove();

  }, 2000);

}


/* ================================
   FUNGSI TAMPILKAN PROGRES
================================ */

function tampilkanProgress(data) {

  const result =
    document.getElementById(
      "progressResult"
    );

  result.classList.remove("hidden");


  if (!data || data.length === 0) {

    return;

  }


  document.getElementById(
    "studentName"
  ).innerText =
    "📊 Progres " +
    data[0].nama;


  document.getElementById(
    "totalLatihan"
  ).innerText =
    data.length;


  const videoCount =
    data.filter(function(item) {

      return item.video &&
             item.video !== "";

    }).length;


  document.getElementById(
    "totalVideo"
  ).innerText =
    videoCount;


  const progress =
    Math.min(
      100,
      data.length * 10
    );


  document.getElementById(
    "progressPercent"
  ).innerText =
    progress + "%";


  document.getElementById(
    "progressBar"
  ).style.width =
    progress + "%";


  const container =
    document.getElementById(
      "historyContainer"
    );

  container.innerHTML = "";


  data.forEach(function(item, index) {

    const card =
      document.createElement("div");

    card.className =
      "history";


    let videoHTML = "";


    if (item.video) {

      videoHTML = `
        <a
          class="video-link"
          href="${item.video}"
          target="_blank"
        >
          🎥 Lihat Video
        </a>
      `;

    }


    card.innerHTML = `

      <h3>
        Pertemuan
        ${item.pertemuan || index + 1}
      </h3>

      <p>
        <strong>Materi:</strong>
        ${item.materi || "-"}
      </p>

      <p>
        <strong>Hasil:</strong>
        ${item.hasil || "-"}
        ${item.satuan || ""}
      </p>

      <p>
        <strong>Keterampilan:</strong>
        ${item.indikator || "-"}
      </p>

      ${videoHTML}

      <div class="reflection">
        <strong>🌱 Yang sudah berhasil</strong>
        <p>${item.berhasil || "-"}</p>
      </div>

      <div class="reflection">
        <strong>💭 Kesulitan</strong>
        <p>${item.kesulitan || "-"}</p>
      </div>

      <div class="reflection">
        <strong>💡 Pembelajaran dari kesalahan</strong>
        <p>${item.pelajaran || "-"}</p>
      </div>

      <div class="reflection">
        <strong>🎯 Target berikutnya</strong>
        <p>${item.target || "-"}</p>
      </div>

      <div class="reflection">
        <strong>🧠 Growth Statement</strong>
        <p>${item.growth || "-"}</p>
      </div>

    `;


    container.appendChild(card);

  });

}

</script>
