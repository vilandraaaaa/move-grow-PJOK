<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzUXY2bEkz0usWfUV4QC-j_4RiYP6OMDHp6QkFFA72RCzvn6Qh5jJIbqCYK5FjAWg6V/exec";


function showPage(page){

  document
    .getElementById("inputPage")
    .classList.toggle(
      "hidden",
      page !== "input"
    );

  document
    .getElementById("dashboardPage")
    .classList.toggle(
      "hidden",
      page !== "dashboard"
    );

}


/* ==========================================
   SIMPAN PROGRES
========================================== */

function submitTraining(){

  const status =
    document.getElementById("statusInput");

  const nama =
    document.getElementById("nama").value.trim();

  const kelas =
    document.getElementById("kelas").value;

  const materi =
    document.getElementById("materi").value;

  const pertemuan =
    document.getElementById("pertemuan").value;

  const tanggal =
    document.getElementById("tanggal").value;

  if(
    !nama ||
    !kelas ||
    !materi ||
    !pertemuan ||
    !tanggal
  ){

    status.className =
      "status error";

    status.style.display =
      "block";

    status.innerHTML =
      "❌ Lengkapi data wajib terlebih dahulu.";

    return;

  }


  status.className =
    "status";

  status.style.display =
    "block";

  status.innerHTML =
    "⏳ Mengirim data ke Google Sheets...";


  /*
   * FORM HTML TERSEMBUNYI
   *
   * Tidak menggunakan fetch POST.
   */

  const form =
    document.createElement("form");

  form.method = "POST";

  form.action = API_URL;

  form.target = "moveGrowFrame";

  form.style.display = "none";


  const data = {

    nama:
      nama,

    kelas:
      kelas,

    materi:
      materi,

    pertemuan:
      pertemuan,

    tanggal:
      tanggal,

    indikator:
      document.getElementById(
        "indikator"
      ).value,

    hasil:
      document.getElementById(
        "hasil"
      ).value,

    satuan:
      document.getElementById(
        "satuan"
      ).value,

    catatan:
      document.getElementById(
        "catatan"
      ).value,

    berhasil:
      document.getElementById(
        "berhasil"
      ).value,

    kesulitan:
      document.getElementById(
        "kesulitan"
      ).value,

    pelajaran:
      document.getElementById(
        "pelajaran"
      )?.value || "",

    target:
      document.getElementById(
        "target"
      ).value,

    growth:
      document.getElementById(
        "growth"
      ).value

  };


  /*
   * MASUKKAN DATA KE FORM
   */

  Object.keys(data).forEach(
    function(key){

      const input =
        document.createElement(
          "input"
        );

      input.type = "hidden";

      input.name = key;

      input.value =
        data[key];

      form.appendChild(input);

    }
  );


  document.body.appendChild(form);


  /*
   * KIRIM
   */

  form.submit();


  /*
   * Karena Apps Script tidak
   * memberi response langsung
   * ke halaman utama,
   * kita beri waktu sebentar.
   */

  setTimeout(
    function(){

      status.className =
        "status success";

      status.style.display =
        "block";

      status.innerHTML =
        "✅ Data berhasil dikirim. Silakan cek Google Sheets.";


      document
        .getElementById(
          "trainingForm"
        )
        .reset();

    },
    2500
  );

}


/* ==========================================
   IFRAME UNTUK POST
========================================== */

const frame =
  document.createElement("iframe");

frame.name =
  "moveGrowFrame";

frame.id =
  "moveGrowFrame";

frame.style.display =
  "none";

document.body.appendChild(frame);


/* ==========================================
   AMBIL PROGRES
========================================== */

async function loadProgress(){

  const nama =
    document
      .getElementById(
        "cariNama"
      )
      .value
      .trim();


  const status =
    document.getElementById(
      "statusDashboard"
    );


  if(!nama){

    status.className =
      "status error";

    status.style.display =
      "block";

    status.innerHTML =
      "❌ Masukkan nama terlebih dahulu.";

    return;

  }


  status.className =
    "status";

  status.style.display =
    "block";

  status.innerHTML =
    "⏳ Mengambil progres...";


  try{

    const response =
      await fetch(
        API_URL +
        "?nama=" +
        encodeURIComponent(
          nama
        )
      );


    const result =
      await response.json();


    if(
      result.status !==
      "success"
    ){

      throw new Error(
        result.message ||
        "Gagal mengambil data."
      );

    }


    const data =
      result.data || [];


    if(
      data.length === 0
    ){

      throw new Error(
        "Data siswa belum ditemukan."
      );

    }


    tampilkanProgress(
      data
    );


    status.style.display =
      "none";


  }catch(error){

    status.className =
      "status error";

    status.style.display =
      "block";

    status.innerHTML =
      "❌ " +
      error.message;

  }

}


/* ==========================================
   TAMPILKAN PROGRES
========================================== */

function tampilkanProgress(data){

  document
    .getElementById(
      "progressResult"
    )
    .classList.remove(
      "hidden"
    );


  document.getElementById(
    "studentName"
  ).innerHTML =
    "📊 Progres " +
    data[0].nama;


  document.getElementById(
    "totalLatihan"
  ).innerText =
    data.length;


  const videoCount =
    data.filter(
      item =>
        item.video &&
        item.video !== ""
    ).length;


  document.getElementById(
    "totalVideo"
  ).innerText =
    videoCount;


  const progress =
    Math.min(
      100,
      data.length * 10
    );


  document.getElementById(
    "progressPercent"
  ).innerText =
    progress + "%";


  document.getElementById(
    "progressBar"
  ).style.width =
    progress + "%";


  const container =
    document.getElementById(
      "historyContainer"
    );


  container.innerHTML = "";


  data.forEach(
    function(item,index){

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "history";


      let videoHTML = "";


      if(item.video){

        videoHTML = `
          <a
            class="video-link"
            href="${item.video}"
            target="_blank"
          >
            🎥 Lihat Video
          </a>
        `;

      }


      card.innerHTML = `

        <h3>
          Pertemuan
          ${item.pertemuan || index + 1}
        </h3>

        <p>
          <strong>Materi:</strong>
          ${item.materi || "-"}
        </p>

        <p>
          <strong>Hasil:</strong>
          ${item.hasil || "-"}
          ${item.satuan || ""}
        </p>

        <p>
          <strong>Keterampilan:</strong>
          ${item.indikator || "-"}
        </p>

        ${videoHTML}

        <div class="reflection">
          <strong>🌱 Yang sudah berhasil</strong>
          <p>${item.berhasil || "-"}</p>
        </div>

        <div class="reflection">
          <strong>💭 Kesulitan</strong>
          <p>${item.kesulitan || "-"}</p>
        </div>

        <div class="reflection">
          <strong>💡 Pembelajaran dari kesalahan</strong>
          <p>${item.pelajaran || "-"}</p>
        </div>

        <div class="reflection">
          <strong>🎯 Target berikutnya</strong>
          <p>${item.target || "-"}</p>
        </div>

        <div class="reflection">
          <strong>🧠 Growth Statement</strong>
          <p>${item.growth || "-"}</p>
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}

</script>
